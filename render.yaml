databases:
  - name: futurefarm-db
    plan: free
    databaseName: futurefarm
    user: futurefarm

services:
  - type: keyvalue
    name: futurefarm-redis
    plan: free
    # Block public Redis access; Render services use the private network.
    ipAllowList: []

  # Keras product classification inference service.
  - type: web
    name: futurefarm-product-model
    plan: 1c-2g
    runtime: docker
    dockerfilePath: services/product-model/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HF_MODEL_REPO
        value: winXT/futurefarm-product-model
      - key: HF_MODEL_FILENAME
        value: product_model_mvp_final.keras
      - key: HF_TOKEN
        sync: false
      - key: MODEL_API_TOKEN
        sync: false

  - type: web
    name: futurefarm-api
    plan: free
    runtime: node
    healthCheckPath: /health
    buildCommand: bun install && bunx turbo run build --filter=@futurefarm/api
    startCommand: cd apps/api && bun run start
    envVars:
      - key: BUN_VERSION
        value: "1.4.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: futurefarm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: futurefarm-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Required only for the first deploy; set false after the schema exists.
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: futurefarm-web
    plan: free
    runtime: static
    buildCommand: bun install && bunx turbo run build --filter=@futurefarm/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BUN_VERSION
        value: "1.4.0"
      - key: VITE_API_BASE_URL
        sync: false
